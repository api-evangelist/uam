x-coverage:
  state: covered
  reason: covered
  detail: >-
    UAM's programmable footprint was reached and read directly, not inferred. Four anonymously
    readable institution-operated endpoints returned real payloads on probe — the DSpace 7.6.5
    HAL REST API, its OAI-PMH 2.0 endpoint and its OpenSearch descriptor on repositorio.uam.es,
    and a second OAI-PMH 2.0 endpoint over the Open Journal Systems journals portal on
    revistas.uam.es. Three further institution-operated surfaces are live but gated by
    institutional identity: a Shibboleth service provider on the repository host, the two Moodle
    instances' LTI 1.3 key and token services, and the Moodle web services endpoint. Two registry
    memberships (Crossref 10.15366, ROR 01cby8j38) and one federation registration (SIR/eduGAIN)
    were confirmed against the registries themselves.

    What UAM does not have is equally settled and is stated rather than padded: no developer
    portal, no published OpenAPI or AsyncAPI for anything, no API terms of service, no API key or
    OAuth client issuance, no open-data portal (datosabiertos.uam.es and transparencia.uam.es do
    not resolve; www.uam.es/uam/datos-abiertos returns 404), no DataCite membership
    (api.datacite.org/clients returns zero matches for "uam" and "autonoma"; the repository issues
    Handle identifiers under prefix 10486 instead), and no official institutional GitHub
    organization — github.com/uam has zero public repositories and no name, and every other
    UAM-named org found is a research group or student society. No SCIM, OneRoster, Ed-Fi, Caliper
    or QTI endpoint was found.

    Two access conditions were encountered and are recorded as facts about us, not findings about
    UAM. revistas.uam.es fronts browser User-Agents with an Anubis proof-of-work challenge that
    answers HTTP 200 on every path including nonexistent ones; probing it with a plain User-Agent
    dissolved the challenge and revealed the real OJS installation. And portalcientifico.uam.es,
    the research portal linked from UAM's own library page, resolves to 45.151.245.19 — outside
    UAM address space, in RIPE-administered NL space — and never completes a TLS handshake
    (curl exit 28 at 45 s), so it could not be classified and is not recorded as a surface.
