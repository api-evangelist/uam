aid: uam
name: Autonomous University of Madrid
x-type: university
x-category: Public Research University
description: >-
  The Autonomous University of Madrid (Universidad Autónoma de Madrid, UAM) is a public
  research university in Madrid, Spain, founded in 1968 and ranked #198 in the QS World
  University Rankings 2025. UAM publishes no developer portal, no API terms and no OpenAPI
  description of anything, and it issues no API keys — but unlike most institutions in this
  cohort its machine-readable surfaces are genuinely its own rather than a vendor's contract
  running under its name. Every host carrying a surface below resolves inside RIPE inetnum
  150.244.0.0 – 150.244.255.255, netname UAM, org ORG-UADM1-RIPE, with no CNAME to a vendor
  platform: UAM licenses DSpace, Open Journal Systems and Moodle and runs them on its own
  address space. What is anonymously consumable today is the Biblos-e Archivo repository
  (a DSpace 7.6.5 HAL REST API, an OAI-PMH 2.0 endpoint and an OpenSearch descriptor) and a
  second OAI-PMH 2.0 endpoint over the university's Open Journal Systems journals portal at
  revistas.uam.es. Beyond that, UAM operates a Shibboleth service provider on its own
  repository host, is registered as an identity provider in SIR/eduGAIN through RedIRIS, runs
  two Moodle instances that publish live LTI 1.3 signing keys, and is a Crossref member minting
  DOIs under prefix 10.15366. No vendor product specification is stored in this repository:
  a generic DSpace, OJS or Moodle contract describes the vendor's engineering, not UAM's.
