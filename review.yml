        note: OAI-PMH 2.0 Identify confirmed via fetch (curl 403 via WAF).
      - url: https://repositorio.uam.es/
        status: 200
        note: Biblos-e Archivo repository home, live (curl 403 via WAF).
      - url: https://www.uam.es/
