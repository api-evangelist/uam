  - date: '2026-09-01'
    rating: 3
    summary: >-
      Re-profiled under the university pipeline, with operator settled before any surface was
      saved. The 2026-06-03 profile was correct as far as it went but incomplete: it recorded two
      surfaces and missed four more. Operator was settled by address space rather than hostname,
      and the answer is unusually clean for this cohort — repositorio.uam.es, revistas.uam.es,
      moodle.uam.es, posgrado.uam.es, sede.uam.es and id.uam.es all resolve inside RIPE inetnum
      150.244.0.0 – 150.244.255.255, netname UAM, org ORG-UADM1-RIPE, with no CNAME to any vendor
      platform. UAM licenses DSpace, OJS and Moodle and runs them itself. New institution-operated
      finds this pass: an OAI-PMH 2.0 endpoint over the Open Journal Systems journals portal at
      revistas.uam.es; a Shibboleth service provider on the repository host self-publishing SAML
      metadata and a discovery feed naming IDP_UAM; two Moodle instances publishing live LTI 1.3
      JWKS; and an OpenSearch 1.1 descriptor on the repository. New relationships: UAM's SAML
      identity provider registered in SIR/eduGAIN through RedIRIS (Sirtfi-assured, scope uam.es),
      Crossref membership 6788 under prefix 10.15366 with 10,886 DOIs, ROR 01cby8j38, Handle
      prefix 10486, and two Springshare tenancies (biblioguias → region-eu.libguides.com,
      biblioagenda → region-eu.libcal.com) recorded as tenant rather than saved as contracts. No
      vendor product specification was stored. Two access conditions worth recording: revistas.uam.es
      fronts browser User-Agents with an Anubis proof-of-work challenge that returns 200 on every
      path, and portalcientifico.uam.es — linked from UAM's own library page — resolves outside UAM
      address space to 45.151.245.19 and never completes a TLS handshake, so it could not be
      classified. Still absent and stated rather than padded: no developer portal, no OpenAPI, no
      API terms, no key issuance, no open-data portal, no DataCite membership, no institutional
      GitHub organization.
