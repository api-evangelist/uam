description: >-
  Verbatim responses captured from live Universidad Autonoma de Madrid surfaces. Nothing in
  this directory is synthesized: each file is the unmodified body returned by the URL recorded
  against it, with the observed status and content type. Every host here resolves inside
  150.244.0.0/16, the RIPE legacy allocation whose netname is UAM and whose descr is
  "Universidad Autonoma de Madrid", so operator is institution for all of them. No vendor
  product contract is stored in this repository - a generic DSpace, OJS or Moodle
  specification describes the vendor's engineering, not UAM's, and would be identical in
  every university repo that deployed it. What is stored is the UAM-specific document each
  UAM host actually serves.
